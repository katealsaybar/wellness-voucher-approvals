# Keeps the Wellness Voucher database from pausing.
#
# WHY THIS EXISTS
#   The voucher log lives on a Supabase FREE project (vlqvefsaxztitcbhirxt). Free projects
#   pause after about a week with no requests. A paused project means the till tool at
#   voucher-issue/voucher-issue.html cannot allocate a serial, and because printing is
#   deliberately blocked when nothing can be logged, reception cannot hand a client her
#   card at all. One read every couple of days is enough to keep it awake.
#
# WHAT A HEALTHY REPLY LOOKS LIKE NOW
#   Since sql/voucher_lockdown.sql (20 Aug), anon holds no grant on the voucher tables, so
#   the publishable key below is REFUSED by design. That refusal is the success case: one
#   request proves the database is awake AND the lockdown is still holding. If this ping
#   ever gets actual rows back, the lockdown has regressed and client names are on an open
#   URL again, which is a louder emergency than a paused project, so that fails the run too.
#
# THIS IS A STOPGAP, NOT THE FIX
#   It only answers the pausing. It does nothing about backups, which is the larger free-tier
#   problem for something that is the only record of who holds which serial. The real fix is
#   to move the project onto a paid plan and out of a former employee's organisation. Delete
#   this file once that is done: a heartbeat guarding a till is a thing to remove, not keep.
#
# THE KEY BELOW IS NOT A LEAK
#   sb_publishable_... is a publishable key. It is designed to sit in a browser, it is
#   already served in this repo's own JavaScript on the public site, and since the lockdown
#   it reaches nothing at all on the voucher tables. Being refused is its whole job here.
#
# CAVEAT
#   GitHub disables scheduled workflows after 60 days of no repository activity. That
#   outlasts this campaign, but it is another quiet failure, which is why the job below is
#   written to FAIL rather than warn. A failed run emails you; a silent one teaches nothing.

name: Keep Supabase awake

on:
  schedule:
    # 06:00 UTC every second day. GitHub's cron can run late, sometimes by an hour or more,
    # which is why the interval is two days against a roughly seven day pause window rather
    # than something tighter.
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Knock on voucher_counters and expect to be refused
        env:
          SUPABASE_URL: https://vlqvefsaxztitcbhirxt.supabase.co
          SUPABASE_KEY: sb_publishable_JlOzwdcK0xjmE6j3nHmwhg_xDKxq1vv
        run: |
          set -uo pipefail

          # No --fail-with-body here: since the lockdown a 401 is the expected, healthy
          # answer, so curl has to hand the body back rather than turn the refusal into
          # an exit code. Only a transport failure (nothing answered) exits non-zero.
          reply=$(curl --silent --show-error \
            --max-time 30 \
            --write-out $'\n%{http_code}' \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/voucher_counters?select=branch,next_seq&order=branch") \
            || { echo "Nothing answered at all: transport failure or timeout." >&2; exit 1; }

          status=${reply##*$'\n'}
          body=${reply%$'\n'*}
          echo "HTTP ${status}: ${body}"

          case "$body" in
            *'"branch"'*)
              # Rows came back on the anonymous key. The database is awake, but the
              # lockdown has regressed and the voucher tables are public again.
              # Re-run sql/voucher_lockdown.sql before anything else.
              echo "LOCKDOWN REGRESSED: voucher_counters is readable anonymously." >&2
              exit 1 ;;
            *'42501'*|*'permission denied'*)
              echo "Awake, and the lockdown is holding: refused, as designed." ;;
            *)
              # Reached something, but the reply is neither counters nor the expected
              # refusal: a paused project's holding page lands here, and so does any
              # future change to the API's error shape.
              echo "Unexpected reply: neither data nor the lockdown's refusal." >&2
              exit 1 ;;
          esac
