<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Client names and purchase dates. Not for search results. -->
<meta name="robots" content="noindex,nofollow">
<title>The voucher log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/voucher-card.css">
<style>
:root{
  --bg:#FAF8F4; --paper:#FFFFFF; --ink:#2D2E37; --muted:#6E6E77;
  --line:#E7E2D8; --accent:#99F6E4; --sand:#F1ECE3;
  --amber:#B4823A; --amber-bg:#FBF3E2; --blue:#3B6E8F; --blue-bg:#E6F0F5;
  --green:#3E7A5E; --green-bg:#E4F1EA; --red:#B24A4A; --red-bg:#F7E9E9;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;}
.wrap{max-width:1240px;margin:0 auto;padding:32px 24px 90px;}

.brandlogo{height:32px;width:auto;display:block;margin-bottom:16px;}
.top{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:20px;}
.crumb{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.crumb a{color:var(--blue);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;}
.crumb a:hover{color:var(--ink);text-decoration-thickness:2px;}
.team{font-family:var(--serif);font-size:clamp(28px,5vw,42px);line-height:1.05;font-weight:600;margin-bottom:8px;}
.owns{font-size:16px;color:var(--muted);max-width:66ch;}

.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px;}
.who b{color:var(--ink);}
.pill{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--sand);color:var(--ink);}
.pill.admin{background:var(--ink);color:#fff;}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.bar input[type=search]{flex:1 1 260px;font-family:var(--sans);font-size:15px;padding:11px 13px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);}
.bar input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--ink);}
.bar label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}

.btn{font-family:var(--sans);font-size:13px;font-weight:600;padding:8px 13px;border-radius:8px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;}
.btn.ghost{background:#fff;color:var(--ink);}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red);}
.btn.sm{font-size:12px;padding:6px 10px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.note{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:16px;}
.note.flag{background:var(--red-bg);border-left:3px solid var(--red);}
.note.info{background:var(--blue-bg);border-left:3px solid var(--blue);}
.tally{font-size:13px;color:var(--muted);margin-bottom:12px;}

/* ---------------- the table ---------------- */
/* Wide, so it scrolls inside its own box rather than making the page scroll sideways. */
.twrap{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:980px;}
thead th{
  text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;
  cursor:pointer;user-select:none;position:sticky;top:0;background:var(--paper);
}
thead th:hover{color:var(--ink);}
thead th .ar{opacity:0;margin-left:5px;font-size:9px;}
thead th.on{color:var(--ink);}
thead th.on .ar{opacity:1;}
thead th.num,tbody td.num{text-align:right;}

tbody tr.r{border-bottom:1px solid var(--line);cursor:pointer;}
tbody tr.r:hover{background:var(--sand);}
tbody tr.r.void{background:var(--red-bg);}
tbody tr.r.arch{opacity:.5;}
tbody td{padding:11px 12px;vertical-align:middle;}
td.ser{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;white-space:nowrap;}
td.nm{font-weight:600;}
td.dt{white-space:nowrap;color:var(--muted);}

.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--sand);white-space:nowrap;}
.tag.warn{background:var(--amber-bg);color:var(--amber);}
.tag.ok{background:var(--green-bg);color:var(--green);}
.tag.bad{background:var(--red-bg);color:var(--red);}

tr.det > td{padding:0 12px 18px;background:#fff;}
tr.det.hide{display:none;}
.dbox{border-top:1px solid var(--line);padding-top:14px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(180px,auto);gap:22px;align-items:start;}
@media (max-width:900px){.dbox{grid-template-columns:1fr;}}
.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}

.friends{margin:0 0 12px;padding:0;list-style:none;}
.friends li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);}
.friends li b{flex:1;font-weight:500;}
.friends .n{width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;}
.muted{color:var(--muted);}

.addf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;}
.addf .fld{flex:1 1 130px;}
.addf label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:4px;}
.addf input{width:100%;font-family:var(--sans);font-size:14px;padding:8px 10px;
  border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px;}

/* ---------------- hover preview ---------------- */
/* Follows the pointer rather than sitting in the row, so it never pushes the table about.
   pointer-events:none matters: the preview must never eat the click that opens the row. */
#peek{position:fixed;z-index:60;display:none;pointer-events:none;}
#peek .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  text-align:center;margin-top:7px;}

/* ---------------- the popup ---------------- */
#modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(45,46,55,.55);
  padding:24px;overflow:auto;}
#modal.on{display:block;}
.sheet{background:var(--paper);border-radius:16px;max-width:560px;margin:0 auto;
  padding:22px 24px 26px;box-shadow:0 24px 60px rgba(45,46,55,.3);}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:4px;}
.shead h2{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;}
.shead .x{background:none;border:0;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px;}
.ssub{font-size:13px;color:var(--muted);margin-bottom:16px;}
.setbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.pick{font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;font-family:var(--sans);}
.pick.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.pick.off{opacity:.45;}
.pick .v{font-weight:400;opacity:.7;margin-left:4px;}
.stage{display:flex;justify-content:center;padding:6px 0 12px;}
.scap{text-align:center;font-size:13px;color:var(--muted);margin-bottom:14px;}
.scap code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--sand);
  padding:2px 7px;border-radius:5px;color:var(--ink);font-weight:600;}
/* The mapping gate. Amber unticked, because it is the one thing on this sheet standing
   between the person and the button under it, and green once ticked so a confirmed voucher
   reads as settled rather than as another thing to do. Same two colours the till uses for
   the practice toggle, for the same reason: a state you must notice, then a state you
   can stop looking at. */
.mapbox{display:flex;gap:9px;align-items:flex-start;margin:0 0 14px;padding:11px 13px;
  border:1px solid var(--amber);border-left-width:3px;border-radius:10px;
  background:var(--amber-bg);font-size:12.5px;line-height:1.5;cursor:pointer;}
.mapbox input{margin-top:2px;flex:0 0 auto;cursor:pointer;}
.mapbox.on{border-color:var(--green);background:var(--green-bg);cursor:default;}
.mapbox.on input{cursor:default;}

.srow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.snote{border-radius:10px;padding:11px 13px;font-size:13px;margin-top:14px;}
.snote.good{background:var(--green-bg);border-left:3px solid var(--green);}
.snote.flag{background:var(--red-bg);border-left:3px solid var(--red);}
</style>
</head>
<body data-auth-root="../">
<div class="wrap">

  <div class="top">
    <img class="brandlogo" src="../assets/tara-rose-logo-black.png" alt="Tara Rose Salon">
    <div class="crumb"><a href="../voucher-issue/voucher-issue.html">Issue a card</a> &rsaquo; The log</div>
    <div class="team">The voucher log</div>
    <p class="owns">Every Wellness Card issued, who issued it, and how far each client is towards her referral credit. Hover a row to see her card, click it for the whole set.</p>
    <div class="who" id="who"></div>
  </div>

  <div class="note info" id="rolenote"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search a name, a serial, a branch or who issued it" autocomplete="off">
    <label><input type="checkbox" id="showarch"> Show archived</label>
    <button class="btn ghost" id="refresh">Refresh</button>
  </div>

  <p class="tally" id="tally">Loading&hellip;</p>

  <div class="twrap">
    <table>
      <thead><tr id="hrow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div id="none"></div>
</div>

<div id="peek"></div>

<div id="modal" aria-hidden="true">
  <div class="sheet" id="sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../auth/supabase-client.js"></script>
<script src="../shared/voucher-card.js"></script>
<script src="../shared/signin-gate.js"></script>
<script>
/* ------------------------------------------------------------------ *
 * The voucher log. Reads for anyone, changes for Kate only.
 *
 * Every control that writes is hidden unless TRS.isAdmin(), but that is convenience, not the
 * guard. The guard is the RLS policies in sql/voucher_roles_fix.sql,
 * sql/voucher_referrals.sql and sql/voucher_fix_typo.sql, all of which check
 * public.is_admin(auth.uid()). If this file is wrong the database still refuses.
 *
 * The cards shown here are built by shared/voucher-card.js from the log row, so they are the
 * same cards the till printed rather than a second drawing of them.
 * ------------------------------------------------------------------ */

var C = window.TRSCard;
function el(id){ return document.getElementById(id); }
function db(){ return (window.TRS && window.TRS.db) || null; }
function admin(){ return !!(window.TRS && window.TRS.isAdmin && window.TRS.isAdmin()); }

var rows = [], friendsBy = {}, notesBy = {}, hasReferrals = true;
var openRows = {}, sortKey = 'created_at', sortDir = -1, modalSet = null, modalIdx = 0;

/* ---------- the columns, and how each one sorts ---------- */
// One entry per column: its heading, how to draw the cell, and what to sort on. Sorting on
// the underlying value rather than the rendered text matters for dates and money, where the
// text sorts alphabetically and lies.
var COLS = [
  {key:'main_serial', head:'Serial', cls:'ser',
   get:function(r){ return C.esc(r.main_serial); },
   sort:function(r){ return r.branch + C.pad4(r.seq); }},

  {key:'client_name', head:'Client', cls:'nm',
   get:function(r){
     var s = C.esc(r.client_name);
     if (r.is_voided)   s += ' <span class="tag bad">Voided</span>';
     if (r.is_archived) s += ' <span class="tag">Archived</span>';
     return s;
   },
   sort:function(r){ return (r.client_name || '').toLowerCase(); }},

  {key:'branch', head:'Branch',
   get:function(r){ return C.esc(r.branch) + ' <span class="muted">' + C.esc(r.emirate) + '</span>'; },
   sort:function(r){ return r.branch; }},

  {key:'tier_name', head:'Voucher',
   get:function(r){ return C.esc(r.tier_name); },
   sort:function(r){ return r.credit_aed; }},

  {key:'credit_aed', head:'Credit', cls:'num',
   get:function(r){ return C.money(r.credit_aed); },
   sort:function(r){ return r.credit_aed; }},

  {key:'purchase_date', head:'Bought', cls:'dt',
   get:function(r){ return C.fmt(r.purchase_date); },
   sort:function(r){ return r.purchase_date; }},

  {key:'main_expires_on', head:'Expires', cls:'dt',
   get:function(r){ return C.fmt(r.main_expires_on); },
   sort:function(r){ return r.main_expires_on; }},

  {key:'friends_so_far', head:'Referral',
   get:function(r){
     if (!hasReferrals) return '<span class="tag">not set up</span>';
     if (r.referral_earned) return '<span class="tag ok">Earned &middot; AED ' + C.money(r.referral_aed) + '</span>';
     return '<span class="tag warn">' + (r.friends_so_far || 0) + ' of ' + (r.friends_needed || 3) + '</span>';
   },
   sort:function(r){ return (r.referral_earned ? 100 : 0) + (r.friends_so_far || 0); }},

  {key:'issued_by', head:'Issued by',
   get:function(r){ return C.esc(r.issued_by || ''); },
   sort:function(r){ return (r.issued_by || '').toLowerCase(); }},

  {key:'created_at', head:'Logged', cls:'dt',
   get:function(r){ return C.fmt(String(r.created_at).slice(0, 10)); },
   sort:function(r){ return r.created_at; }}
];

/* ---------- who is looking ---------- */
function drawWho(){
  var email = window.TRS && window.TRS.email ? window.TRS.email() : null;
  var isAdm = admin();

  el('who').innerHTML = email
    ? 'Signed in as <b>' + C.esc(email) + '</b> <span class="pill' + (isAdm ? ' admin' : '') + '">' +
      (isAdm ? 'can edit' : 'view only') + '</span> <button class="btn ghost sm" id="signout">Sign out</button>'
    : 'Not signed in <span class="pill">view only</span> ' +
      '<a class="btn ghost sm" href="' + (window.TRS ? window.TRS.loginUrl() : '#') +
      '" style="text-decoration:none">Sign in</a>';

  if (el('signout')){
    el('signout').addEventListener('click', function(){
      window.TRS.signOut().then(function(){ drawWho(); draw(); });
    });
  }

  el('rolenote').className = 'note info';
  el('rolenote').innerHTML = isAdm
    ? '<b>You can change things here.</b> Fixing a mistyped name, recording a friend towards a ' +
      'referral, archiving a row and voiding a card are all yours alone. <b>Archive hides a row. ' +
      'Void kills the card</b>, and reception will turn the client away at the desk, so they are ' +
      'two different buttons on purpose.'
    : '<b>This is a read-only view.</b> Everything issued is listed and every card can be viewed ' +
      'and printed, but only Kate can correct a name or retire a card. Sign in if you are her.';
}

/* ---------- load ---------- */
function load(){
  var d = db();
  if (!d){ el('tally').textContent = 'Cannot reach the database.'; return Promise.resolve(); }
  el('tally').textContent = 'Loading…';

  return d.from('voucher_log').select('*').limit(1000)
    .then(function (res){
      if (res.error){
        el('tally').innerHTML = 'Could not read the log. <span class="muted">' + C.esc(res.error.message) + '</span>';
        rows = [];
        return;
      }
      rows = res.data || [];

      // voucher_referrals.sql adds friends_so_far to the view. Absent means that migration has
      // not been run, and every referral control goes quiet rather than rendering
      // "undefined of 3" beside a client's name.
      hasReferrals = !rows.length || Object.prototype.hasOwnProperty.call(rows[0], 'friends_so_far');
      if (!hasReferrals){ friendsBy = {}; notesBy = {}; return; }

      return d.from('voucher_referrals').select('*').order('visited_on', {ascending:true})
        .then(function (r2){
          friendsBy = {};
          (r2.data || []).forEach(function (f){
            (friendsBy[f.issue_id] = friendsBy[f.issue_id] || []).push(f);
          });
          // Notes belong on screen, not only in the table. A corrected name leaves one, and
          // the desk needs to see why a card in a client's hand is spelled differently.
          return d.from('voucher_events').select('issue_id,detail,recorded_by,created_at')
            .eq('kind', 'note').order('created_at', {ascending:true});
        })
        .then(function (r3){
          notesBy = {};
          ((r3 && r3.data) || []).forEach(function (n){
            (notesBy[n.issue_id] = notesBy[n.issue_id] || []).push(n);
          });
        });
    })
    .then(draw);
}

/* ---------- draw ---------- */
function drawHead(){
  el('hrow').innerHTML = COLS.map(function (c){
    var on = c.key === sortKey;
    return '<th class="' + (c.cls === 'num' ? 'num ' : '') + (on ? 'on' : '') + '" data-k="' + c.key + '">' +
      C.esc(c.head) + '<span class="ar">' + (on && sortDir > 0 ? '&#9650;' : '&#9660;') + '</span></th>';
  }).join('');
}

function draw(){
  drawHead();

  var term = el('q').value.trim().toLowerCase();
  var withArchived = el('showarch').checked;
  var col = COLS.filter(function (c){ return c.key === sortKey; })[0] || COLS[0];

  var shown = rows.filter(function (r){
    if (!withArchived && r.is_archived) return false;
    return !term || (r.search_text || '').indexOf(term) > -1;
  }).sort(function (a, b){
    var x = col.sort(a), y = col.sort(b);
    if (x === y) return 0;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (x > y ? 1 : -1) * sortDir;
  });

  var live = rows.filter(function (r){ return !r.is_archived && !r.is_voided; });
  var placed = live.reduce(function (a, r){ return a + (r.credit_aed || 0); }, 0);
  var earned = live.filter(function (r){ return r.referral_earned; }).length;

  el('tally').innerHTML = '<b>' + live.length + '</b> live ' + (live.length === 1 ? 'voucher' : 'vouchers') +
    ' &middot; <b>AED ' + C.money(placed) + '</b> of credit placed &middot; <b>' + earned + '</b> ' +
    (earned === 1 ? 'has' : 'have') + ' earned the referral credit' +
    (term ? ' &middot; showing ' + shown.length + ' for &ldquo;' + C.esc(term) + '&rdquo;' : '');

  if (!hasReferrals){
    el('rolenote').className = 'note flag';
    el('rolenote').innerHTML = '<b>Referral tracking is not set up yet.</b> Run ' +
      '<code>sql/voucher_referrals.sql</code> in the Supabase SQL editor. Until then this page ' +
      'lists the cards but cannot count friends.';
  }

  el('body').innerHTML = shown.map(rowHtml).join('');
  el('none').innerHTML = shown.length ? '' :
    '<div class="empty">' + (rows.length ? 'Nothing matches that.' :
      'Nothing issued yet. Cards appear here as reception issues them.') + '</div>';
}

function rowHtml(r){
  var cells = COLS.map(function (c){
    return '<td class="' + (c.cls || '') + '">' + c.get(r) + '</td>';
  }).join('');

  return '<tr class="r' + (r.is_voided ? ' void' : '') + (r.is_archived ? ' arch' : '') +
           '" data-id="' + r.id + '">' + cells + '</tr>' +
         '<tr class="det' + (openRows[r.id] ? '' : ' hide') + '" data-det="' + r.id + '">' +
           '<td colspan="' + COLS.length + '">' + detailHtml(r) + '</td></tr>';
}

function detailHtml(r){
  var isAdm = admin();
  var friends = friendsBy[r.id] || [];
  var need = r.friends_needed || 3;
  var notes = notesBy[r.id] || [];
  var left = '';

  if (hasReferrals){
    left += '<div class="lbl">Friends who came in and paid</div>';
    left += friends.length
      ? '<ul class="friends">' + friends.map(function (f, i){
          return '<li><span class="n">' + (i + 1) + '</span><b>' + C.esc(f.friend_name) + '</b>' +
            '<span class="muted">' + C.fmt(f.visited_on) +
            (f.gift_serial ? ' &middot; ' + C.esc(f.gift_serial) : '') + '</span>' +
            (isAdm ? '<button class="btn danger sm" data-delf="' + f.id + '">Remove</button>' : '') +
          '</li>';
        }).join('') + '</ul>'
      : '<p class="muted" style="margin-bottom:12px">None yet. Reaching ' + need +
        ' earns the credit, and that day starts the two months.</p>';

    if (isAdm){
      left += '<div class="addf">' +
        '<div class="fld"><label>Her friend&rsquo;s name</label>' +
          '<input type="text" data-fn="' + r.id + '" placeholder="Full name"></div>' +
        '<div class="fld"><label>Day she visited and paid</label>' +
          '<input type="date" data-fd="' + r.id + '" value="' + C.iso(C.today()) + '"></div>' +
        '<div class="fld"><label>Gift card serial, if she had one</label>' +
          '<input type="text" data-fg="' + r.id + '" placeholder="WV-' + r.tier + 'G-' + r.branch + '-' +
            C.pad4(r.seq) + '-1"></div>' +
        '<button class="btn sm" data-addf="' + r.id + '">Add this friend</button>' +
      '</div>';
    }
  }

  if (notes.length){
    left += '<div style="margin-top:14px"><div class="lbl">On the record</div>' +
      notes.map(function (n){
        return '<p class="muted" style="font-size:13px;margin-bottom:3px">' + C.esc(n.detail) +
          (n.recorded_by ? ' <span style="opacity:.7">&middot; ' + C.esc(n.recorded_by) + '</span>' : '') + '</p>';
      }).join('') + '</div>';
  }

  left += '<div class="acts">' +
    '<button class="btn sm" data-cards="' + r.id + '">View her cards</button>' +
    (isAdm ? '<button class="btn ghost sm" data-rename="' + r.id + '">Fix the name</button>' : '') +
    (isAdm && !r.is_archived ? '<button class="btn ghost sm" data-arch="' + r.id + '">Archive this row</button>' : '') +
    (isAdm && !r.is_voided ? '<button class="btn danger sm" data-void="' + r.id + '">Void this card</button>' : '') +
  '</div>';

  var right =
    '<div><div class="lbl">Friend cards</div>' + r.friend_cards + ' &times; AED 100, expire ' +
      C.fmt(r.friend_expires_on) + '</div>' +
    '<div style="margin-top:10px"><div class="lbl">Referral credit</div>' +
      (hasReferrals && r.referral_earned
        ? 'AED ' + C.money(r.referral_aed) + ', expires ' + C.fmt(r.referral_expires_on)
        : '<span class="muted">AED ' + C.money(r.referral_aed) + ', not earned yet</span>') +
    '</div>' +
    '<div style="margin-top:10px"><div class="lbl">How to reach her</div>' +
      (r.client_contact
        ? C.esc(r.client_contact)
        : '<span class="muted">Nothing recorded. Two clients with this name cannot be told ' +
          'apart from the log alone.</span>') +
    '</div>' +
    (r.void_reason
      ? '<div style="margin-top:10px"><div class="lbl">Voided because</div>' + C.esc(r.void_reason) + '</div>'
      : '');

  return '<div class="dbox"><div>' + left + '</div><div style="font-size:13.5px">' + right + '</div></div>';
}

/* ---------- hover preview ---------- */
// Built on demand, not for all 500 rows up front. One card, the main one, at .sm size.
var peekFor = null;
function showPeek(r, x, y){
  if (peekFor !== r.id){
    var set = C.setFromLogRow(r);
    el('peek').innerHTML = C.render(set, set.cards[0], 'sm') +
      '<div class="cap">Click the row for all ' + set.cards.length + ' cards</div>';
    peekFor = r.id;
  }
  var p = el('peek');
  p.style.display = 'block';
  // Kept inside the window: flipped to the other side of the pointer when it would overflow.
  var w = 272, h = 195;
  var left = x + 18, top = y + 14;
  if (left + w > window.innerWidth) left = x - w - 18;
  if (top + h > window.innerHeight) top = Math.max(8, y - h - 14);
  p.style.left = left + 'px';
  p.style.top = top + 'px';
}
function hidePeek(){ el('peek').style.display = 'none'; }

/* ---------- the popup ---------- */
function openModal(r){
  if (!r) return;
  modalSet = C.setFromLogRow(r);
  modalIdx = 0;
  el('modal').classList.add('on');
  el('modal').setAttribute('aria-hidden', 'false');
  drawModal();
}
function closeModal(){
  el('modal').classList.remove('on');
  el('modal').setAttribute('aria-hidden', 'true');
  modalSet = null;
}
// The Confidence Mapping gate, and the only control on this page that unlocks something
// rather than recording something that already happened.
//
// It sits under the serial because that is where the eye already is before pressing Save, and
// because the thing it gates is the pair of buttons directly below it.
//
// WHAT TICKING IT MEANS. Not "she booked a mapping" and not "an email went out". It means the
// person ticking has opened the info@ inbox and seen her answers, because that is where the
// quiz delivers them and there is no other place to check. Nothing in this database can verify
// that, which is why the label says who is being asked to look rather than just what to tick.
//
// It cannot be unticked. The write is a row in voucher_events, which is append-only like every
// other later state here, so a mapping that was confirmed by mistake is a note to add, not a
// tick to take back. Same standing as a friend being counted towards the referral.
function mapBox(set){
  var k = set.cards.filter(function (c){ return c.type === 'K'; })[0];
  if (!k) return '';

  if (set.mappingConfirmed){
    var who = set.mappingBy ? ' by ' + C.esc(set.mappingBy) : '';
    var when = set.mappingAt ? ' on ' + C.fmt(new Date(set.mappingAt)) : '';
    return '<label class="mapbox on"><input type="checkbox" checked disabled>' +
      '<span><b>Confidence Mapping confirmed</b>' + who + when + '. Her kit card can be ' +
      'saved and her file now carries it.</span></label>';
  }

  return '<label class="mapbox" for="mapok"><input type="checkbox" id="mapok">' +
    '<span><b>I have seen her Confidence Mapping answers in the info@ inbox.</b> ' +
    'Until this is ticked the kit card cannot be saved on its own and is left out of her ' +
    'file, because her kit is matched to her at the mapping and cannot be made up before it. ' +
    'Her card and her birthday card save as normal.</span></label>';
}

function drawModal(){
  var set = modalSet, card = set.cards[modalIdx];

  el('sheet').innerHTML =
    '<div class="shead"><h2>' + C.esc(set.name) + '</h2>' +
      '<button class="x" id="mx" aria-label="Close">&times;</button></div>' +
    '<p class="ssub">' + C.esc(C.TIERS[set.tier].name) + ' &middot; ' +
      C.esc(C.BRANCHES[set.branch].name) + ' &middot; bought ' + C.fmt(set.purchase) + '</p>' +

    '<div class="setbar">' + set.cards.map(function (c, i){
      return '<button class="pick' + (i === modalIdx ? ' on' : '') + (c.printable ? '' : ' off') +
        '" data-i="' + i + '">' + C.esc(c.label) +
        '<span class="v">AED ' + C.money(c.value) + '</span></button>';
    }).join('') + '</div>' +

    '<div class="stage">' + C.render(set, card) + '</div>' +
    '<p class="scap">Full serial <code>' + card.serial + '</code></p>' +

    mapBox(set) +

    '<div class="srow">' +
      '<button class="btn" id="mall">Save her file</button>' +
      '<button class="btn ghost" id="mone"' + (card.printable ? '' : ' disabled') + '>Save just this card</button>' +
      '<button class="btn ghost" id="mser">Copy the serial</button>' +
    '</div>' +

    (card.note ? '<div class="snote ' + (card.printable ? 'good' : 'flag') + '">' + card.note + '</div>' : '');

  el('mx').addEventListener('click', closeModal);

  el('sheet').querySelector('.setbar').addEventListener('click', function (e){
    var b = e.target.closest('.pick');
    if (!b) return;
    modalIdx = +b.getAttribute('data-i');
    drawModal();
  });

  var tick = el('mapok');
  if (tick) tick.addEventListener('change', function(){
    if (!this.checked) return;
    this.disabled = true;
    // Written before anything unlocks, so the button never opens on a tick the database
    // refused. A failed write puts the box back rather than leaving it ticked and useless.
    addEvent(set.id, 'mapping_confirmed', 'Answers seen in the info@ inbox')
      .then(function (res){
        if (res.error){
          alert('Not saved, so nothing is unlocked: ' + res.error.message +
                NL + NL +
                'If this says the kind is not allowed, sql/voucher_mapping.sql has not been ' +
                'run on this database yet.');
          tick.checked = false; tick.disabled = false;
          return;
        }
        // The table AND the sheet in front of her. Reloading only the table would leave the
        // modal showing an unticked box over a button that had just unlocked.
        load().then(function (){
          var fresh = byId(set.id);
          if (fresh){ modalSet = C.setFromLogRow(fresh); drawModal(); }
        });
      });
  });

  el('mall').addEventListener('click', function(){ C.printHers(set); });
  el('mone').addEventListener('click', function(){
    C.printOne(set, card);
  });
  el('mser').addEventListener('click', function(){
    var btn = this;
    function done(){
      btn.textContent = 'Copied';
      setTimeout(function(){ btn.textContent = 'Copy the serial'; }, 1400);
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(card.serial).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = card.serial; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });
}

/* ---------- writes, admin only, refused by the database otherwise ---------- */
function byId(id){ return rows.filter(function (r){ return r.id === id; })[0]; }
var NL = String.fromCharCode(10);

function addFriend(id){
  var name = document.querySelector('[data-fn="' + id + '"]').value.trim();
  var when = document.querySelector('[data-fd="' + id + '"]').value;
  var gift = document.querySelector('[data-fg="' + id + '"]').value.trim().toUpperCase();
  if (!name || !when) return;
  db().from('voucher_referrals').insert({
    issue_id:id, friend_name:name, visited_on:when,
    gift_serial:gift || null, recorded_by:window.TRS.email()
  }).then(function (res){
    if (res.error){ alert('Not saved: ' + res.error.message); return; }
    load();
  });
}

function addEvent(id, kind, detail){
  return db().from('voucher_events').insert({
    issue_id:id, kind:kind, detail:detail || null, recorded_by:window.TRS.email()
  });
}

function rename(id){
  var row = byId(id);
  if (!row) return;
  var next = prompt(
    'Spell her name the way Phorest has it.' + NL + NL +
    'This fixes a typo only. The serial, the branch, the voucher and every date stay as they ' +
    'are, because those are not typos, they are a different card.',
    row.client_name);
  if (next === null) return;
  next = next.trim();
  if (next.length < 2){ alert('That is too short to be a name.'); return; }
  if (next === row.client_name) return;

  db().from('voucher_issues').update({client_name:next}).eq('id', id)
    .then(function (res){
      if (res.error){ alert('Not changed: ' + res.error.message); return null; }
      // What it used to say, kept on the record. The correction is allowed; losing the fact
      // that it happened is not, because she may hold a card with the old spelling printed
      // on it and the desk needs to know why the two differ.
      return addEvent(id, 'note', 'Name corrected from "' + row.client_name + '" to "' + next + '"');
    })
    .then(function (){ load(); });
}

/* ---------- wiring ---------- */
el('hrow').addEventListener('click', function (e){
  var th = e.target.closest('th');
  if (!th) return;
  var k = th.getAttribute('data-k');
  if (k === sortKey){ sortDir = -sortDir; } else { sortKey = k; sortDir = 1; }
  draw();
});

el('body').addEventListener('mousemove', function (e){
  var tr = e.target.closest('tr.r');
  if (!tr){ hidePeek(); return; }
  var r = byId(tr.getAttribute('data-id'));
  if (r) showPeek(r, e.clientX, e.clientY);
});
el('body').addEventListener('mouseleave', hidePeek);

el('body').addEventListener('click', function (e){
  var t = e.target;

  if (t.hasAttribute('data-cards')){ hidePeek(); openModal(byId(t.getAttribute('data-cards'))); return; }
  if (t.hasAttribute('data-rename')){ rename(t.getAttribute('data-rename')); return; }
  if (t.hasAttribute('data-addf')){ addFriend(t.getAttribute('data-addf')); return; }

  if (t.hasAttribute('data-delf')){
    if (!confirm('Remove this friend from the count?')) return;
    db().from('voucher_referrals').delete().eq('id', t.getAttribute('data-delf'))
      .then(function (res){
        if (res.error){ alert('Not removed: ' + res.error.message); return; }
        load();
      });
    return;
  }

  if (t.hasAttribute('data-arch')){
    addEvent(t.getAttribute('data-arch'), 'archived', null).then(load);
    return;
  }

  if (t.hasAttribute('data-void')){
    // Void IS what reception acts on, so it asks for a reason and says what happens.
    var why = prompt('Voiding means reception will refuse this card at the desk.' + NL + NL + 'Why?');
    if (why === null) return;
    if (!why.trim()){ alert('A reason is needed, so the desk can explain it to her.'); return; }
    addEvent(t.getAttribute('data-void'), 'voided', why.trim()).then(load);
    return;
  }

  // Anywhere else on the row opens or closes it.
  var tr = t.closest('tr.r');
  if (!tr) return;
  var id = tr.getAttribute('data-id');
  openRows[id] = !openRows[id];
  var det = el('body').querySelector('tr.det[data-det="' + id + '"]');
  if (det) det.classList.toggle('hide');
});

el('modal').addEventListener('click', function (e){ if (e.target === el('modal')) closeModal(); });
document.addEventListener('keydown', function (e){ if (e.key === 'Escape') closeModal(); });

el('q').addEventListener('input', draw);
el('showarch').addEventListener('change', draw);
el('refresh').addEventListener('click', load);

// This page lists client names, which is the one thing in the pack that was never ours to
// leave on a public URL. Nothing loads until there is a session. The overlay is only the
// sentence; the enforcement is that anon holds no grant on voucher_log. See
// sql/voucher_lockdown.sql.
if (window.TRSGate){
  window.TRSGate.require('This page lists client names').then(function (){
    drawWho(); return load();
  });
  window.TRS.onAuthChange(function (){ drawWho(); draw(); });
} else {
  drawWho();
  load();
}
</script>
